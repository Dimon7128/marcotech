# Docker's DNS lets this upstream follow the API if its container IP changes.
upstream model_backend {
    zone model_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server model-api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # /api/predict becomes /predict; the browser never resolves model-api itself.
    location /api/ {
        proxy_pass http://model_backend/;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @model_unavailable;
    }

    # Return JSON instead of an HTML proxy error when the backend is down.
    location @model_unavailable {
        default_type application/json;
        return 503 '{"detail":"The model service is unavailable. Start it and try again."}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
