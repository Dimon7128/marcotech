name: sms-lab

services:
  model-api:
    image: sms-api:lab4
    build:
      context: ./sms-service
      dockerfile: dockerfile
    # Other containers use this port; it is not published on the host.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  frontend:
    image: sms-chat:lab4
    build:
      context: ./chat-client
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      model-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
