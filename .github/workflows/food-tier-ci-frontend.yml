# --- Food Tier App: Frontend CI ---------------------------------------------
# Static-only frontend (no Node, no build step). The pipeline is therefore
# trivial: assert the files exist, build the nginx image, hit it with curl,
# push to Amazon ECR (on push-to-main only). Same tagging scheme as the
# backend (sha + staging) and same OIDC auth model.
#
# NOTE: The project lives at Etgar/food-tier-app/ inside the marcotech repo;
# the path filters and build context below are prefixed accordingly.
# ---------------------------------------------------------------------------

name: food-tier-app — frontend CI

on:
  push:
    branches: [main]
    paths:
      - "Etgar/food-tier-app/frontend/**"
      - ".github/workflows/food-tier-ci-frontend.yml"
  pull_request:
    paths:
      - "Etgar/food-tier-app/frontend/**"
      - ".github/workflows/food-tier-ci-frontend.yml"
  workflow_dispatch:

concurrency:
  group: food-tier-ci-frontend-${{ github.ref }}
  cancel-in-progress: true

# OIDC token is needed to assume the AWS deploy role for ECR push.
permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: food-tier-frontend
  PROJECT_DIR: Etgar/food-tier-app/frontend

jobs:
  validate-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # -------- Static checks: file existence ------------------------------
      - name: Verify required static files exist
        run: |
          for f in index.html app.js style.css nginx.conf; do
            full="${{ env.PROJECT_DIR }}/$f"
            if [ ! -f "$full" ]; then
              echo "missing required file: $full"
              exit 1
            fi
            echo "ok: $full"
          done

      # -------- Build the nginx image --------------------------------------
      # Tag with the ECR registry URL straight away so the same reference
      # flows through smoke test + (on push-to-main) push step.
      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }} \
            ${{ env.PROJECT_DIR }}

      # -------- Smoke-test: does it actually serve the page? ---------------
      - name: Run frontend container
        run: |
          docker run -d \
            --name frontend-ci \
            -p 8080:80 \
            ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}

      - name: Curl the frontend (expect HTTP 200)
        run: |
          for i in $(seq 1 15); do
            # `-o /dev/null` discards body; `-w '%{http_code}'` prints just the status.
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080)
            if [ "$code" = "200" ]; then
              echo " — frontend served HTTP 200"
              exit 0
            fi
            echo "waiting for nginx... ($i/15) — got: $code"
            sleep 1
          done
          echo "frontend never returned 200:"
          docker logs frontend-ci
          exit 1

      - name: Stop CI container
        if: always()
        run: docker rm -f frontend-ci || true

      # -------- Push image(s) ----------------------------------------------
      # All push-related steps are gated on push-to-main. PR runs build
      # and smoke-test only — the AWS deploy role's trust policy is
      # locked to `refs/heads/main`, so PRs cannot push.
      - name: Configure AWS credentials via OIDC
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}
          role-session-name: gh-actions-food-tier-ci-frontend

      - name: Login to Amazon ECR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push immutable SHA tag
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}

      - name: Promote to staging tag
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }} \
            ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:staging
          docker push ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:staging
