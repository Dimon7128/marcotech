# --- Food Tier App: Backend CI ----------------------------------------------
# Runs on every push that touches the backend, OR this workflow file itself.
# Builds, tests, and (on push-to-main only) pushes the backend image to
# Amazon ECR with two tags:
#   1. The exact commit SHA (immutable — what you would deploy)
#   2. `staging`         (moving pointer — what CD picks up next)
#
# Auth uses GitHub OIDC -> the same AWS IAM role the CD workflow uses
# (see infra/main.tf). No static credentials are stored in GitHub.
#
# NOTE: The project lives at Etgar/food-tier-app/ inside the marcotech repo,
# so every path below is prefixed accordingly. GitHub Actions only reads
# workflows from .github/workflows/ at the REPO ROOT, which is why this
# file lives here and not inside the project folder.
# ---------------------------------------------------------------------------

name: food-tier-app — backend CI

on:
  push:
    branches: [main]
    paths:
      - "Etgar/food-tier-app/backend/**"
      - ".github/workflows/food-tier-ci-backend.yml"
  pull_request:
    paths:
      - "Etgar/food-tier-app/backend/**"
      - ".github/workflows/food-tier-ci-backend.yml"
  # Lets you re-run on demand from the Actions tab if you change a secret.
  workflow_dispatch:

# Cancel older in-flight runs for the same branch — saves CI minutes.
concurrency:
  group: food-tier-ci-backend-${{ github.ref }}
  cancel-in-progress: true

# OIDC token is needed to assume the AWS deploy role for ECR push.
# `contents: read` is the default for these triggers but spelled out
# so the least-privilege intent is explicit.
permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: food-tier-backend
  # Single source of truth for "where is the backend?" — referenced in
  # every step below so future restructuring is a one-line change.
  PROJECT_DIR: Etgar/food-tier-app/backend

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # -------- Python tests (fast feedback before we touch Docker) --------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Etgar/food-tier-app/backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: pip install -r requirements-dev.txt

      - name: Static syntax check (py_compile)
        working-directory: ${{ env.PROJECT_DIR }}
        # py_compile is built-in to Python and catches typos / bad indents
        # without needing a third-party linter.
        run: python -m py_compile main.py food_storage.py openai_client.py

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        # `-q` = quiet, `--maxfail=1` = stop on first failure (faster feedback).
        run: pytest -q --maxfail=1

      # -------- Build the production image ---------------------------------
      # We tag with the ECR registry URL straight away so the same image
      # reference flows through the smoke test and (on push-to-main) the
      # push step below — no `docker tag` shuffling required.
      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }} \
            ${{ env.PROJECT_DIR }}

      # -------- Smoke-test the image we just built -------------------------
      - name: Run backend container
        run: |
          # The container does not need a real OPENAI_API_KEY for /health,
          # so we pass a dummy value just to satisfy any startup code.
          docker run -d \
            --name backend-ci \
            -p 8000:8000 \
            -e OPENAI_API_KEY=dummy-ci-key \
            ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}

      - name: Wait for the container to become healthy
        run: |
          # Poll /health for up to ~30s. Fail loudly if it never returns 200.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo " — backend is up"
              exit 0
            fi
            echo "waiting for backend... ($i/30)"
            sleep 1
          done
          echo "backend never became healthy:"
          docker logs backend-ci
          exit 1

      - name: Verify /health body
        run: |
          # Belt-and-suspenders: check the JSON body matches exactly.
          body=$(curl -fsS http://localhost:8000/health)
          echo "got: $body"
          test "$body" = '{"status":"ok"}'

      - name: Stop CI container
        if: always()
        run: docker rm -f backend-ci || true

      # -------- Push image(s) ----------------------------------------------
      # All push-related steps are gated on push-to-main. PR runs build
      # and smoke-test only — they cannot assume the AWS role (its trust
      # policy is locked to `refs/heads/main`) so attempting OIDC on a PR
      # would just fail with an unhelpful error.
      - name: Configure AWS credentials via OIDC
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ secrets.AWS_REGION }}
          role-session-name: gh-actions-food-tier-ci-backend

      - name: Login to Amazon ECR
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push immutable SHA tag
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }}

      - name: Promote to staging tag
        # `staging` is a moving pointer — CD will pull this next.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:${{ github.sha }} \
            ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:staging
          docker push ${{ secrets.ECR_REGISTRY }}/${IMAGE_NAME}:staging
