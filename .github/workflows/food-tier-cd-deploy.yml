# --- Food Tier App: Continuous Deployment (OIDC + SSM Run Command) ---------
# Manual ("button-press") deployment. Triggered from the Actions tab.
#
# Auth model — no SSH, no static AWS keys, no Docker Hub credentials:
#   GitHub Actions  --(OIDC)-->  AWS IAM Role  --(ssm:SendCommand)-->  EC2
#                                            \--(ecr:PutImage)--> ECR
#
# The runner exchanges a signed OIDC token for short-lived STS credentials
# via aws-actions/configure-aws-credentials. With those creds it can:
#   * call SSM to run docker commands on each EC2 (deploy + reload), and
#   * call ECR directly to retag :staging -> :prod server-side (zero
#     image bytes transferred through the runner).
#
# The EC2s authenticate to ECR via their own instance profile (the
# AWS-managed `AmazonEC2ContainerRegistryReadOnly` policy), so the SSM
# commands just need `aws ecr get-login-password | docker login` — no
# secrets ever leave AWS.
#
# Flow:
#   1. Deploy `:staging` images to Blue EC2 via SSM.
#   2. Run integration tests against Blue EC2 (curl from the runner).
#   3. If Blue tests pass, promote `:staging` -> `:prod` in ECR via
#      `aws ecr put-image` (server-side retag — no docker pull/push).
#   4. Deploy `:prod` images to Prod EC2 via SSM.
#   5. Run health checks against Prod EC2.
# ---------------------------------------------------------------------------

name: food-tier-app — deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        default: ""

# OIDC token write is required for aws-actions/configure-aws-credentials
# to call AssumeRoleWithWebIdentity. `contents: read` is the default for
# workflow_dispatch but we spell it out so least-privilege is explicit.
permissions:
  id-token: write
  contents: read

concurrency:
  # Never run two deployments at the same time — they would race on EC2.
  group: food-tier-cd-deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE: food-tier-backend
  FRONTEND_IMAGE: food-tier-frontend
  # Absolute path on the EC2. SSM Run Command runs as root with no $HOME,
  # so `cd ~/food-tier-app` would fail — we must use a full path.
  # The Terraform in `Etgar/food-tier-app/infra/` provisions Ubuntu AMIs,
  # so the project lives under /home/ubuntu/. Change to /home/ec2-user/
  # if you swap to an Amazon Linux base.
  APP_DIR: /home/ubuntu/food-tier-app

jobs:
  # =========================================================================
  # Stage 1: deploy + validate on Blue EC2
  # =========================================================================
  deploy-blue:
    runs-on: ubuntu-latest

    steps:
      - name: Guard — require the confirmation word
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo 'You must type "deploy" in the confirm input to proceed.'
            exit 1
          fi

      # --------------------------------------------------------------------
      # Authenticate to AWS via GitHub OIDC. No long-lived keys involved —
      # this exchanges a one-time signed JWT for ~1-hour STS credentials.
      # --------------------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}
          # Friendly session name shows up in CloudTrail next to every API call.
          role-session-name: gh-actions-food-tier-deploy-blue

      - name: Sanity check — who am I (in AWS)?
        # Prints the assumed-role ARN. Helpful when debugging IAM problems.
        run: aws sts get-caller-identity

      # --------------------------------------------------------------------
      # Build a small JSON file with the commands SSM will run, then send
      # it. Heredoc is used so AWS_REGION / ECR_REGISTRY interpolate
      # cleanly into the JSON-quoted command strings.
      # --------------------------------------------------------------------
      - name: Deploy :staging images to Blue EC2 via SSM
        env:
          # ECR login on the EC2 uses the instance profile — no static
          # credentials are passed through the SSM payload. We only need
          # the region (to pick the right ECR endpoint) and the registry
          # URL (the `docker login` target).
          AWS_REGION:   ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          INSTANCE_ID:  ${{ vars.BLUE_EC2_INSTANCE_ID }}
          # Source of truth for the docker-compose.yml served via raw.githubusercontent.
          # Resolves to e.g. "Dimon7128/marcotech". `github.repository` is always
          # owner/name of the repo running the workflow.
          GH_REPO:      ${{ github.repository }}
          IMAGE_TAG:    staging
        run: |
          set -euo pipefail

          # Build the JSON payload. `workingDirectory` makes SSM cd before
          # running the commands — cleaner than embedding `cd` in every line.
          # The pre-flight block (curl + grep guards) is idempotent: it lays
          # down docker-compose.yml and .env on first run, no-ops thereafter.
          # That makes "destroy → apply → click CD" a zero-touch flow.
          cat > /tmp/ssm-commands.json <<JSON
          {
            "workingDirectory": ["${APP_DIR}"],
            "commands": [
              "set -e",
              "[ -f docker-compose.yml ] || curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/${GH_REPO}/main/Etgar/food-tier-app/docker-compose.yml",
              "[ -f .env ] || touch .env",
              "grep -q '^ECR_REGISTRY='      .env || echo 'ECR_REGISTRY=${ECR_REGISTRY}'           >> .env",
              "grep -q '^IMAGE_TAG='         .env || echo 'IMAGE_TAG=${IMAGE_TAG}'                 >> .env",
              "grep -q '^OPENAI_PARAM_NAME=' .env || echo 'OPENAI_PARAM_NAME=/food-tier/openai-key' >> .env",
              "grep -q '^AWS_REGION='        .env || echo 'AWS_REGION=${AWS_REGION}'               >> .env",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "docker compose ps"
            ]
          }
          JSON

          # SendCommand is async — it returns a CommandId we have to poll.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "food-tier-app deploy :staging" \
            --parameters file:///tmp/ssm-commands.json \
            --query "Command.CommandId" \
            --output text)
          echo "SSM CommandId: $CMD_ID"

          # `wait command-executed` polls every 5s until the command leaves
          # the in-progress state. `|| true` keeps the step alive so we
          # always print the script's stdout/stderr below for debugging.
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" || true

          # Show what actually happened on the box.
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status, Code:ResponseCode, Stdout:StandardOutputContent, Stderr:StandardErrorContent}" \
            --output json

          # Fail the step if SSM reports anything other than Success.
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          [ "$STATUS" = "Success" ]

      # --------------------------------------------------------------------
      # Integration tests — run from the runner (not from inside SSM) so
      # the workflow exercises the same network path real users would.
      # --------------------------------------------------------------------
      - name: Wait for Blue EC2 to come up
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ vars.BLUE_EC2_HOST }}:8000/health" > /dev/null; then
              echo "Blue backend is up"
              break
            fi
            echo "waiting for Blue backend... ($i/30)"
            sleep 2
          done

      - name: Integration test — frontend HTTP 200 on Blue
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://${{ vars.BLUE_EC2_HOST }}:8080")
          echo "frontend status: $code"
          test "$code" = "200"

      - name: Integration test — backend /health on Blue
        run: |
          body=$(curl -fsS "http://${{ vars.BLUE_EC2_HOST }}:8000/health")
          echo "health body: $body"
          test "$body" = '{"status":"ok"}'

      - name: Integration test (optional) — CSV cache hit on Blue
        # Uses GET /api/history/{food} so it does NOT spend OpenAI tokens.
        run: |
          response=$(curl -s "http://${{ vars.BLUE_EC2_HOST }}:8000/api/history/egg")
          echo "history response: $response"
          if echo "$response" | grep -q '"exists":true'; then
            echo " — CSV cache contains 'egg' as expected"
          else
            echo "note: 'egg' not yet in CSV cache (this is OK on a fresh server)"
          fi

      - name: Clean unused Docker resources on Blue EC2
        if: success()
        env:
          INSTANCE_ID: ${{ vars.BLUE_EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "food-tier-app prune unused docker resources" \
            --parameters 'commands=["docker image prune -f","docker container prune -f"]' \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

  # =========================================================================
  # Stage 2: promote :staging -> :prod in ECR, then deploy to Prod EC2
  # =========================================================================
  promote-and-deploy-prod:
    needs: deploy-blue
    runs-on: ubuntu-latest

    steps:
      # -------- Auth first — both promotion and the SSM deploy need it ----
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ vars.AWS_REGION }}
          role-session-name: gh-actions-food-tier-deploy-prod

      # -------- Promote tags inside ECR -----------------------------------
      # `aws ecr put-image` adds a new tag to an existing manifest
      # server-side. No `docker pull/tag/push` from the runner — zero
      # image bytes move, the promotion is effectively instant.
      - name: Promote backend image  staging -> prod
        run: |
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "${BACKEND_IMAGE}" \
            --image-ids imageTag=staging \
            --query 'images[0].imageManifest' --output text)
          aws ecr put-image \
            --repository-name "${BACKEND_IMAGE}" \
            --image-tag prod \
            --image-manifest "$MANIFEST" > /dev/null
          echo "backend: tagged :prod -> same digest as :staging"

      - name: Promote frontend image  staging -> prod
        run: |
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "${FRONTEND_IMAGE}" \
            --image-ids imageTag=staging \
            --query 'images[0].imageManifest' --output text)
          aws ecr put-image \
            --repository-name "${FRONTEND_IMAGE}" \
            --image-tag prod \
            --image-manifest "$MANIFEST" > /dev/null
          echo "frontend: tagged :prod -> same digest as :staging"

      - name: Deploy :prod images to Prod EC2 via SSM
        env:
          AWS_REGION:   ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          INSTANCE_ID:  ${{ vars.PROD_EC2_INSTANCE_ID }}
          GH_REPO:      ${{ github.repository }}
          IMAGE_TAG:    prod
        run: |
          set -euo pipefail

          # Pre-flight bootstrap is idempotent — see deploy-blue for the
          # rationale. The only difference vs Blue is IMAGE_TAG=prod.
          cat > /tmp/ssm-commands.json <<JSON
          {
            "workingDirectory": ["${APP_DIR}"],
            "commands": [
              "set -e",
              "[ -f docker-compose.yml ] || curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/${GH_REPO}/main/Etgar/food-tier-app/docker-compose.yml",
              "[ -f .env ] || touch .env",
              "grep -q '^ECR_REGISTRY='      .env || echo 'ECR_REGISTRY=${ECR_REGISTRY}'           >> .env",
              "grep -q '^IMAGE_TAG='         .env || echo 'IMAGE_TAG=${IMAGE_TAG}'                 >> .env",
              "grep -q '^OPENAI_PARAM_NAME=' .env || echo 'OPENAI_PARAM_NAME=/food-tier/openai-key' >> .env",
              "grep -q '^AWS_REGION='        .env || echo 'AWS_REGION=${AWS_REGION}'               >> .env",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "docker compose down",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "docker compose ps"
            ]
          }
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "food-tier-app deploy :prod" \
            --parameters file:///tmp/ssm-commands.json \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"

          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status, Code:ResponseCode, Stdout:StandardOutputContent, Stderr:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          [ "$STATUS" = "Success" ]

      - name: Wait for Prod EC2 to come up
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ vars.PROD_EC2_HOST }}:8000/health" > /dev/null; then
              echo "Prod backend is up"
              break
            fi
            echo "waiting for Prod backend... ($i/30)"
            sleep 2
          done

      - name: Production health check — frontend HTTP 200
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://${{ vars.PROD_EC2_HOST }}:8080")
          echo "frontend status: $code"
          test "$code" = "200"

      - name: Production health check — backend /health
        run: |
          body=$(curl -fsS "http://${{ vars.PROD_EC2_HOST }}:8000/health")
          echo "health body: $body"
          test "$body" = '{"status":"ok"}'

      - name: Deployment summary
        run: |
          echo "Deployment finished successfully"
          echo "Blue:  http://${{ vars.BLUE_EC2_HOST }}:8080  (image tag: staging)"
          echo "Prod:  http://${{ vars.PROD_EC2_HOST }}:8080  (image tag: prod)"
