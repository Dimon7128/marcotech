# Simple nginx server: listen on 80, serve our 3 static files, and fall
# back to index.html for unknown paths so refreshes never 404.
server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Light caching for the static assets — fine for an educational app.
    location ~* \.(?:css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
