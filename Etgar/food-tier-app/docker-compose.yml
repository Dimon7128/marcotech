# docker-compose.yml — works for BOTH local dev and EC2 deployment.
#
# Local dev (no registry pull, just build from source):
#   docker compose up --build
#   The ${ECR_REGISTRY:-localdev} / ${IMAGE_TAG:-local} defaults tag the
#   freshly-built images as `localdev/food-tier-*:local`.
#
# EC2 deployment (Blue staging / Prod):
#   .env on the host defines:
#     ECR_REGISTRY=<acct>.dkr.ecr.<region>.amazonaws.com
#     IMAGE_TAG=staging               (on Blue EC2)
#     IMAGE_TAG=prod                  (on Prod EC2)
#     OPENAI_PARAM_NAME=/food-tier/openai-key
#     AWS_REGION=il-central-1         (optional — see backend/entrypoint.sh)
#   The real OpenAI key is NOT in this .env file — it lives in AWS SSM
#   Parameter Store (KMS-encrypted SecureString). The backend container
#   fetches it at startup via the EC2 instance profile. Populate it once:
#     aws ssm put-parameter --name /food-tier/openai-key \
#       --type SecureString --value sk-... --overwrite
#   Then (the CD workflow does this automatically via SSM):
#     aws ecr get-login-password --region <region> \
#       | docker login --username AWS --password-stdin ${ECR_REGISTRY}
#     docker compose pull
#     docker compose up -d
#
# Tip: `docker compose down` keeps the CSV file on the host
# (./backend/data/food_history.csv — see the bind mount below).

services:
  backend:
    # `image:` is what `docker compose pull` uses on EC2.
    # `build:` is what `docker compose up --build` uses locally.
    # When both are set, compose tags the built image as `image:` —
    # which is exactly what CI relies on before pushing to ECR.
    image: ${ECR_REGISTRY:-localdev}/food-tier-backend:${IMAGE_TAG:-local}
    build: ./backend
    container_name: food-tier-backend
    ports:
      - "8000:8000"
    environment:
      # Two sources for OPENAI_API_KEY, picked by entrypoint.sh:
      #
      #   Local dev: set OPENAI_API_KEY=sk-... in .env.  Compose passes
      #     it through here; entrypoint sees it set and skips SSM.
      #
      #   On EC2:   leave OPENAI_API_KEY empty, set OPENAI_PARAM_NAME
      #     (e.g. /food-tier/openai-key) in the host's .env instead.
      #     The container's entrypoint then fetches the value from
      #     SSM Parameter Store using the EC2's instance profile.
      #     AWS_REGION is REQUIRED on the EC2 path — boto3 does NOT
      #     auto-detect region from IMDS, only credentials. Without
      #     it, fetch_secret.py raises NoRegionError at client init.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_PARAM_NAME=${OPENAI_PARAM_NAME:-}
      - AWS_REGION=${AWS_REGION:-}
    volumes:
      # Bind mount: the CSV survives container restarts AND is editable
      # from the host, which is great for inspecting the data tier.
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ${ECR_REGISTRY:-localdev}/food-tier-frontend:${IMAGE_TAG:-local}
    build: ./frontend
    container_name: food-tier-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
